openapi: '3.1.0'
info:
  title: PaymentWebhook
  version: 1.0.0
servers:
  - url: /api
    description: Servidor local
  - url: https://example.com/api
    description: Servidor de produção

paths:
  /webhook/payment-status:
    post:
      operationId: receivePaymentStatus
      summary: Recebe o status de um pagamento externo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStatusPayload'
      responses:
        '200':
          description: Webhook processado com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    PaymentStatusPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PAID, CANCELLED]
      required:
        - paymentId
        - status

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: O veículo não está disponível devido a um conflito (já vendido ou não começou a ser vendido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
