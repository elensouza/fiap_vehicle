openapi: '3.1.0'
info:
  title: VehicleService
  version: 1.0.0
servers:
  - url: /api
    description: Servidor local
  - url: https://example.com/api
    description: Servidor de produção
paths:
  /vehicle:
    post:
      operationId: createVehicle
      summary: Cadastra um novo veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePayload'
      responses:
        '200':
          description: Veículo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicle/{id}:
    put:
      operationId: updateVehicle
      summary: Atualiza dados de um veículo existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePayload'
      responses:
        '200':
          description: Veículo atualizado com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/available:
    get:
      operationId: listAvailableVehicles
      summary: Lista todos os veículos disponíveis (não vendidos)
      responses:
        '200':
          description: Lista de veículos disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/sold:
    get:
      operationId: listSoldVehicles
      summary: Lista todos os veículos vendidos
      responses:
        '200':
          description: Lista de veículos vendidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/sell:
    post:
      operationId: sellVehicle
      summary: Marca um veículo como vendido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalePayload'
      responses:
        '200':
          description: Venda registrada com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/payment-status:
    post:
      operationId: registerPaymentStatus
      summary: Atualiza status de pagamento de um veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentStatusPayload'
      responses:
        '200':
          description: Status de pagamento processado com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    VehiclePayload:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        price:
          type: number
          format: double
      required:
        - brand
        - model
        - year
        - color
        - price

    VehicleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        price:
          type: number
          format: double
        status:
          type: string
          enum: [AVAILABLE, SOLD]
        documentBuyer:
          type: string
          nullable: true
        dateSold:
          type: string
          format: date
          nullable: true
      required:
        - id
        - brand
        - model
        - year
        - color
        - price

    SalePayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentBuyer:
          type: string
      required:
        - id
        - documentBuyer

    PaymentStatusPayload:
      type: object
      properties:
        paymentId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PAID, CANCELLED]
        receivedAt:
          type: string
          format: date-time
      required:
        - paymentId
        - status
        - receivedAt

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: O veículo não está disponível devido a um conflito (já vendido ou não começou a ser vendido)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
