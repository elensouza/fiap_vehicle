openapi: '3.1.0'
info:
  title: VehicleService
  version: 1.0.0
servers:
  - url: /api
    description: Servidor local
  - url: https://example.com/api
    description: Servidor de produção
paths:
  /vehicle:
    post:
      operationId: createVehicle
      summary: Cadastra um novo veículo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePayload'
      responses:
        '200':
          description: Veículo cadastrado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicle/{id}:
    get:
      operationId: getVehicleById
      summary: Busca um veículo pelo ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Veículo encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      operationId: updateVehicle
      summary: Atualiza dados de um veículo existente
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehiclePayload'
      responses:
        '200':
          description: Veículo atualizado com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles:
    get:
      operationId: listAvailableVehicles
      summary: Lista todos os veículos disponíveis (não vendidos)
      responses:
        '200':
          description: Lista de veículos disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/sold:
    get:
      operationId: listSoldVehicles
      summary: Lista todos os veículos vendidos
      responses:
        '200':
          description: Lista de veículos vendidos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VehicleResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /vehicles/sell:
    post:
      operationId: sellVehicle
      summary: Marca um veículo como vendido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalePayload'
      responses:
        '200':
          description: Venda registrada com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /payment/webhook:
    post:
      operationId: receivePaymentWebhook
      summary: Recebe notificações de pagamento via webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentWebhookPayload'
      responses:
        '200':
          description: Webhook recebido com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    VehiclePayload:
      type: object
      properties:
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        price:
          type: number
          format: double
      required:
        - brand
        - model
        - year
        - color
        - price

    VehicleResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        brand:
          type: string
        model:
          type: string
        year:
          type: integer
        color:
          type: string
        price:
          type: number
          format: double
        sold:
          type: boolean
          nullable: true
        documentBuyer:
          type: string
          nullable: true
        dateSold:
          type: string
          format: date
          nullable: true
      required:
        - id
        - brand
        - model
        - year
        - color
        - price

    SalePayload:
      type: object
      properties:
        id:
          type: string
          format: uuid
        documentBuyer:
          type: string
      required:
        - id
        - documentBuyer

    PaymentWebhookPayload:
      type: object
      properties:
        paymentId:
          type: string
        status:
          type: string
        price:
          type: number
          format: float
        date:
          type: string
          format: date-time
      required:
        - paymentId
        - status
        - price
        - date

    ErrorResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string

  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    UnprocessableEntity:
      description: Dados inválidos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalServerError:
      description: Erro interno do servidor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
